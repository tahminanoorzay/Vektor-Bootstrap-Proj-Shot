<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Vektor Bootstrap Proj Shot</title>
  </head>
  <body>
    <header>
      <nav
        class="navbar navbar-light justify-content-between px-5 m-2 border-bottom border-1 border-dark"
      >
        <h3 class="fw-bold">Vektor.</h3>
        <div>
          <button href="" class="btn">Features</button>
          <button href="" class="btn">Plans</button>
          <button href="" class="btn btn-primary fw-bold">Get Started</button>
        </div>
      </nav>
    </header>

    <main class="container-fluid px-5 mt-5">
      <div class="row align-items-center">
        <div class="col-md-6">
          <div
            class="rounded-pill py-2 mb-4 px-4 fw-bold d-inline-block main-section-span"
          >
            Release 4.2- All Systems Operational
          </div>
          <h1 class="fw-bold mb-4 main-section-padding">
            Cloud infrastructure, minus the complexity.
          </h1>
          <p class="mb-4 text-secondary pe-5 fs-5">
            Deploy fast, reliable data pipelines and global edge storage in
            minutes with transparent, predictable pricing.
          </p>
          <button class="btn btn-primary fw-bold shadow">View Plans</button>
          <button
            class="btn btn-outline-secondary text-black fw-bold shadow ms-3"
          >
            Explore Features
          </button>
        </div>
        <div class="col-md-6">
          <div class="rounded-4 p-3 shadow">
            <img
              src="/Images/Server Rack.avif"
              alt="Description of the image"
              class="img-fluid rounded-4"
            />
            <div class="d-flex justify-content-between mt-3">
              <span class="text-secondary"
                >Frankfurt . Virginia . Tokyo Edge Mesh</span
              >
              <span class="text-success fw-bold">99.99% Uptime</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
